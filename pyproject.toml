[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quadtank-fdi"
version = "1.0.0"
description = "First-Principles Nonlinear Digital Twin and Observer-Based Fault Detection & Isolation (FDI) Benchmark for the Johansson Quadruple-Tank Process"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Automatic Control Engineering Portfolio" }
]
keywords = [
    "control-theory",
    "fault-detection-and-isolation",
    "extended-kalman-filter",
    "digital-twin",
    "quadruple-tank",
    "state-estimation",
    "lqr",
    "process-control",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Control Systems",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
quadtank-fdi = "quadtank_fdi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
